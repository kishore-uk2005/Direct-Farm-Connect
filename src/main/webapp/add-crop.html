<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Crop - Direct Farm Connect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="container">
        <div class="logo">🌱 Direct Farm Connect</div>

        <nav>
            <a href="farmer-dashboard.html">Dashboard</a>
            <a href="index.html">Logout</a>
        </nav>
    </div>
</header>

<main>

    <div class="form-container">

        <h1>🌾 Add New Crop</h1>

        <p class="form-subtitle">
            Add your crop details so consumers can purchase them directly.
        </p>

        <form action="add-crop" method="post">

            <div class="form-group">

                <label>Crop Name</label>

                <input
                        type="text"
                        name="cropName"
                        placeholder="Example: Tomato"
                        required>

            </div>


            <div class="form-group">

                <label>Price per Kg (₹)</label>

                <input
                        type="number"
                        name="price"
                        placeholder="Enter price per kg"
                        min="1"
                        step="0.01"
                        required>

            </div>


            <div class="form-group">

                <label>Available Quantity (Kg)</label>

                <input
                        type="number"
                        name="quantity"
                        placeholder="Enter available quantity"
                        min="1"
                        required>

            </div>


            <button type="submit" class="full-btn">
                Add Crop
            </button>

        </form>

        <p class="form-footer">

            <a href="farmer-dashboard.html">
                ← Back to Farmer Dashboard
            </a>

        </p>

    </div>

</main>

<footer>
    © 2026 Direct Farm Connect
</footer>

</body>
</html>
